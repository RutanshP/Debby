[project]
name = "debby-api"
version = "0.1.0"
description = "Debby FastAPI backend"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "httpx>=0.27",
    "pydantic>=2.6",
    "openai>=1.30",
    "assemblyai>=0.30",
    "python-jose[cryptography]>=3.3",
    "python-multipart>=0.0.9",
    "supabase>=2.4",
    "python-dotenv>=1.0",
    "textstat>=0.7",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "respx>=0.21",
    "httpx>=0.27",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.setuptools]
packages = ["deps", "models", "routes", "services"]
