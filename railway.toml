# Railway service config for Debby v2 (FastAPI backend).
#
# Recommended deployment: in Railway's service settings set
#   Root Directory: apps/api
# so NIXPACKS auto-detects the Python project from apps/api/pyproject.toml.
# This root-level file intentionally avoids a buildCommand override so Railway
# can let Nixpacks install the Python runtime and dependencies.

[build]
builder = "NIXPACKS"

[deploy]
startCommand = "cd apps/api && uvicorn main:app --host 0.0.0.0 --port $PORT"
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 3
